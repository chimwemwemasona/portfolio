name: Validate and deploy portfolio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check static site
        run: python3 scripts/check_site.py
      - name: Test deployment artifact validation
        run: python3 scripts/test_deployment.py
      - name: Validate deployment scripts
        run: python3 -m py_compile scripts/package_site.py deploy/server_deploy.py deploy/renew_ip_certificate.py
      - name: Package static site
        run: python3 scripts/package_site.py "$GITHUB_SHA" /tmp/portfolio.tar.gz
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Package checked source
        run: python3 scripts/package_site.py "$GITHUB_SHA" /tmp/portfolio.tar.gz
      - name: Deploy and verify release
        env:
          DEPLOY_KEY: ${{ secrets.PORTFOLIO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ]; then
            echo 'Set the PORTFOLIO_DEPLOY_KEY repository secret to enable deployments.'
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/portfolio_deploy_key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$key_file"
          if ! ssh-keygen -y -f "$key_file" >/dev/null 2>&1; then
            echo 'PORTFOLIO_DEPLOY_KEY must contain the complete OpenSSH private key, including BEGIN/END lines.'
            exit 1
          fi
          ssh -T -i "$key_file" -p 22 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/ssh_known_hosts -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 chimwemwe@95.217.214.201 "deploy $GITHUB_SHA" < /tmp/portfolio.tar.gz
          echo "### Live site: https://95.217.214.201/" >> "$GITHUB_STEP_SUMMARY"
