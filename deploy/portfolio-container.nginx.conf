worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        server_name _;
        location = /healthz { access_log off; return 200 "ok\n"; }
        location = / {
            # Preserve the original HTTP container health probe.
            if ($host = 127.0.0.1) { return 200 "ok\n"; }
            return 302 https://95.217.214.201$request_uri;
        }
        location / { return 302 https://95.217.214.201$request_uri; }
    }
    # HTTPS is enabled only in the container that mounts /certs.
    include /certs/*.nginx.conf;
}
